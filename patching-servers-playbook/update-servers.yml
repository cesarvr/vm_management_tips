---
- name: Configure dnf-automatic for 3rd weekend security updates
  hosts: rhel9_cluster  
  become: true
  tasks:
    # --- DEBIAN / UBUNTU ---
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Upgrade critical security packages (Debian/Ubuntu)
      ansible.builtin.apt:
        upgrade: dist
        default_release: "{{ ansible_distribution_release }}-security"
      when: ansible_os_family == 'Debian'

    # --- RHEL / CENTOS / ROCKY / ALMALINUX ---
    - name: Apply critical security updates (DNF / RHEL 8+)
      ansible.builtin.dnf:
        name: '*'
        state: latest
        security: true
        bugfix: false
      when: ansible_os_family == 'RedHat' and ansible_pkg_mgr == 'dnf'

    - name: Apply critical security updates (YUM / RHEL 7)
      ansible.builtin.yum:
        name: '*'
        state: latest
        security: true
        bugfix: false
      when: ansible_os_family == 'RedHat' and ansible_pkg_mgr == 'yum'

    # --- REBOOT CHECK ---
    - name: Check if reboot is required (Debian/Ubuntu)
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      when: ansible_os_family == 'Debian'

    - name: Check if reboot is required (RHEL/CentOS)
      ansible.builtin.command: needs-restarting -r
      register: reboot_required_cmd
      failed_when: false
      changed_when: false
      when: ansible_os_family == 'RedHat'

    - name: Reboot server if required
      ansible.builtin.reboot:
        msg: "Rebooting post security update application"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: >
        (ansible_os_family == 'Debian' and reboot_required_file.stat.exists) or
        (ansible_os_family == 'RedHat' and reboot_required_cmd.rc == 1)
