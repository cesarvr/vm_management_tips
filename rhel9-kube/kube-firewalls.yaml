---
- name: Configure Firewall for Kubernetes Control Plane Nodes
  hosts: control_plane
  become: true
  tasks:
    - name: Open required ports for Control Plane nodes
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - 6443/tcp     # Kubernetes API server
        - 2379-2380/tcp # etcd server client API
        - 10250/tcp    # Kubelet API
        - 10259/tcp    # kube-scheduler
        - 10257/tcp    # kube-controller-manager
        - 4789/udp     # Flannel/Calico CNI VXLAN

- name: Configure Firewall for Kubernetes Worker Nodes
  hosts: workers
  become: true
  tasks:
    - name: Open required ports for Worker nodes
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - 10250/tcp       # Kubelet API
        - 30000-32767/tcp # NodePort Services
        - 4789/udp        # Flannel/Calico CNI VXLAN